<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning Brief</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    header {
      padding: 28px 16px 8px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .sub {
      margin: 4px 0 0;
      color: #71717a;
      font-size: 14px;
    }
    main {
      padding: 8px 16px 32px;
      max-width: 640px;
    }
    .card {
      display: flex;
      gap: 14px;
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .rank {
      font-size: 20px;
      font-weight: 700;
      color: #a1a1aa;
      min-width: 22px;
    }
    h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      margin: 6px 0 0;
      font-size: 13px;
      color: #71717a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #f4f4f5; }
      .card { background: #18181b; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Good morning, Nick</h1>
    <p class="sub">Top stories right now · updated {{ updated }}</p>
  </header>
  <main>
    {% for story in stories %}
      <a class="card" href="{{ story.link }}">
        <span class="rank">{{ loop.index }}</span>
        <div>
          <h2>{{ story.title }}</h2>
          <p class="meta">Covered by {{ story.coverage }} outlets</p>
        </div>
      </a>
    {% endfor %}
  </main>
</body>
</html>
